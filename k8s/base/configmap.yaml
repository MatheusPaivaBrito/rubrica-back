apiVersion: v1
kind: ConfigMap
metadata:
  name: rubrica-config
  namespace: rubrica
data:
  APP_NAME: "Rubrica"
  ENVIRONMENT: "local"
  APP_DEBUG: "true"
  POSTGRES_USER: "rubrica"
  POSTGRES_PASSWORD: "rubrica"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "rubrica"
  CORE_POSTGRES_DB: "rubrica_core"
  AUTH_POSTGRES_DB: "rubrica_auth"
  EVENTING_POSTGRES_DB: "rubrica_eventing"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  KAFKA_HOST: "kafka"
  KAFKA_PORT: "9092"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  EVENTING_KAFKA_ENABLED: "true"
  CORE_WEB_CONCURRENCY: "1"
  AUTH_WEB_CONCURRENCY: "1"
  EVENTING_WEB_CONCURRENCY: "1"
  NOTIFICATION_WEB_CONCURRENCY: "1"
  OBSERVABILITY_WEB_CONCURRENCY: "1"
  AI_WEB_CONCURRENCY: "1"
  AI_POSTGRES_DB: "rubrica_ai"
  AI_PROVIDER_TIMEOUT_SECONDS: "30"
  AI_OPENAI_ENABLED: "0"
  AI_OPENAI_BASE_URL: "https://api.openai.com/v1"
  AI_SERVICE_JWT_ALGORITHM: "HS256"
  AI_SERVICE_JWT_ISSUER: "rubrica"
  AI_SERVICE_JWT_TTL_SECONDS: "300"
  AI_SERVICE_JWT_ALLOWED_CALLERS: "auth_api,core_api,worker"
  NOTIFICATION_PERSISTENCE_MODE: "durable"
  OBSERVABILITY_PERSISTENCE_MODE: "incidents"
