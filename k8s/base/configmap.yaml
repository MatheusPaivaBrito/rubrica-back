apiVersion: v1
kind: ConfigMap
metadata:
  name: rubrica-config
  namespace: rubrica
data:
  APP_NAME: "Rubrica"
  ENVIRONMENT: "local"
  APP_DEBUG: "true"
  POSTGRES_USER: "rubrica"
  POSTGRES_PASSWORD: "rubrica"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "rubrica"
  CORE_POSTGRES_DB: "rubrica_core"
  AUTH_POSTGRES_DB: "rubrica_auth"
  EVENTING_POSTGRES_DB: "rubrica_eventing"
  NOTIFICATION_POSTGRES_DB: "rubrica_notification"
  OBSERVABILITY_POSTGRES_DB: "rubrica_observability"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  KAFKA_HOST: "kafka"
  KAFKA_PORT: "9092"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  EVENTING_KAFKA_ENABLED: "true"
  EVENTING_DEFAULT_EVENT_TOPIC: "rubrica.events"
  EVENTING_DEAD_LETTER_TOPIC: "rubrica.events.dead_letter"
  CORE_WEB_CONCURRENCY: "1"
  AUTH_WEB_CONCURRENCY: "1"
  EVENTING_WEB_CONCURRENCY: "1"
  NOTIFICATION_WEB_CONCURRENCY: "1"
  OBSERVABILITY_WEB_CONCURRENCY: "1"
  NOTIFICATION_PERSISTENCE_MODE: "durable"
  OBSERVABILITY_PERSISTENCE_MODE: "incidents"
