apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: rubrica
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: rubrica
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: nginx:stable-alpine
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /gateway/health
              port: 8080
          livenessProbe:
            httpGet:
              path: /gateway/health
              port: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: gateway-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
            - name: gateway-config
              mountPath: /etc/nginx/proxy_params
              subPath: proxy_params
              readOnly: true
      volumes:
        - name: gateway-config
          configMap:
            name: rubrica-gateway-config
