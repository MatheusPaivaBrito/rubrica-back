map $http_x_request_id $atlas_request_id {
  default $http_x_request_id;
  "" $request_id;
}

server {
  listen 8080;
  server_name _;

  client_max_body_size 50m;
  client_body_timeout 30s;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;
  proxy_send_timeout 60s;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $rubrica_web http://web:80;
  set $rubrica_docs http://docs:8000;

  location = /gateway/health {
    default_type application/json;
    return 200 '{"status":"ok","service":"gateway"}';
  }

  location = /test-accounts {
    return 302 /test-accounts/;
  }

  location /test-accounts/ {
    rewrite ^/test-accounts/(.*)$ /$1 break;
    proxy_pass $rubrica_docs;
    include /etc/nginx/proxy_params;
  }

  location / {
    proxy_pass $rubrica_web;
    include /etc/nginx/proxy_params;
  }
}
