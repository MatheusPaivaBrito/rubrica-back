map $http_x_request_id $atlas_request_id {
  default $http_x_request_id;
  "" $request_id;
}

map $uri $rubrica_access_path {
  ~^/signing(?:/|$) /signing/[redacted];
  default $uri;
}

log_format rubrica_access '$remote_addr - - [$time_local] '
  '"$request_method $rubrica_access_path $server_protocol" $status $body_bytes_sent '
  '"-" "-" request_id=$atlas_request_id';

server {
  listen 8080;
  server_name _;
  access_log /var/log/nginx/access.log rubrica_access;

  # TLS and the public port belong to Cloudflare, not this internal listener.
  absolute_redirect off;

  client_max_body_size 50m;
  client_body_timeout 30s;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;
  proxy_send_timeout 60s;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $rubrica_web http://web:80;
  set $rubrica_docs http://docs:8000;

  location = /gateway/health {
    default_type application/json;
    return 200 '{"status":"ok","service":"gateway"}';
  }

  location = /docs {
    return 302 /docs/;
  }

  location /docs/ {
    proxy_pass $rubrica_docs;
    include /etc/nginx/proxy_params;
  }

  location = /test-accounts {
    return 302 /docs/test-accounts/;
  }

  location = /test-accounts/ {
    return 302 /docs/test-accounts/;
  }

  location = /test-accounts/accounts {
    return 302 /docs/test-accounts/;
  }

  location = /test-accounts/accounts/ {
    return 302 /docs/test-accounts/;
  }

  location /test-accounts/ {
    rewrite ^/test-accounts/(.*)$ /docs/$1 redirect;
  }

  location / {
    proxy_pass $rubrica_web;
    include /etc/nginx/proxy_params;
  }
}
