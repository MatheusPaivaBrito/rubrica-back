map $http_x_request_id $atlas_request_id {
  default $http_x_request_id;
  "" $request_id;
}

server {
  listen 8080;
  server_name _;

  client_max_body_size 50m;
  client_body_timeout 30s;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;
  proxy_send_timeout 60s;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $rubrica_web http://web:80;
  set $rubrica_docs http://docs:8000;

  location = /gateway/health {
    default_type application/json;
    return 200 '{"status":"ok","service":"gateway"}';
  }

  location = /docs {
    return 302 /docs/;
  }

  # Preserve the enterprise API portal and its existing absolute asset URLs.
  location = /docs/api {
    return 302 /docs/api/;
  }

  location ^~ /docs/api/ {
    rewrite ^/docs/api/(.*)$ /docs/$1 break;
    proxy_pass $rubrica_web;
    include /etc/nginx/proxy_params;
  }

  location ~ ^/docs/(style\.css|openapi\.json|sample\.pdf|postman\.json)$ {
    proxy_pass $rubrica_web;
    include /etc/nginx/proxy_params;
  }

  location /docs/ {
    proxy_pass $rubrica_docs;
    include /etc/nginx/proxy_params;
  }

  location = /test-accounts {
    return 302 /docs/test-accounts/;
  }

  location = /test-accounts/ {
    return 302 /docs/test-accounts/;
  }

  location = /test-accounts/accounts {
    return 302 /docs/test-accounts/;
  }

  location = /test-accounts/accounts/ {
    return 302 /docs/test-accounts/;
  }

  location /test-accounts/ {
    rewrite ^/test-accounts/(.*)$ /docs/$1 redirect;
  }

  location / {
    proxy_pass $rubrica_web;
    include /etc/nginx/proxy_params;
  }

  location = /api/v1/serproid/callback {
    access_log off;
    proxy_pass $rubrica_web;
    include /etc/nginx/proxy_params;
  }
}
