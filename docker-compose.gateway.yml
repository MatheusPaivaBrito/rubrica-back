services:
  gateway:
    image: nginx:stable-alpine
    profiles: ["gateway"]
    ports:
      - "${GATEWAY_HOST_PORT:-8181}:8080"
    volumes:
      - ./infra/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/gateway/proxy_params:/etc/nginx/proxy_params:ro
    depends_on:
      - auth-api
      - core-api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/gateway/health"]
      interval: 10s
      timeout: 3s
      retries: 5
