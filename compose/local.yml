name: rubrica

services:

      postgres:
        image: postgres:16-alpine
        environment:
          POSTGRES_USER: ${POSTGRES_USER:-rubrica}
          POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rubrica}
          POSTGRES_DB: ${POSTGRES_DB:-rubrica}
          POSTGRES_MULTIPLE_DATABASES: ${CORE_POSTGRES_DB:-rubrica_core},${AUTH_POSTGRES_DB:-rubrica_auth},${EVENTING_POSTGRES_DB:-rubrica_eventing},${NOTIFICATION_POSTGRES_DB:-rubrica_notification}
        volumes:
          - ../toolbox/database/init_multiple_databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro
        healthcheck:
          test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rubrica} -d ${POSTGRES_DB:-rubrica}"]
          interval: 2s
          timeout: 3s
          retries: 30


      redis:
        image: redis:7-alpine
        healthcheck:
          test: ["CMD", "redis-cli", "ping"]
          interval: 2s
          timeout: 3s
          retries: 30


      core-api:
        build:
          context: ..
          dockerfile: apps/core_api/dockerfile
        command: gunicorn core_api.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers ${CORE_WEB_CONCURRENCY:-2}
        environment:
          PYTHONPATH: apps/core_api/src:packages/shared_kernel/src
          POSTGRES_USER: ${POSTGRES_USER:-rubrica}
          POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rubrica}
          POSTGRES_HOST: postgres
          POSTGRES_PORT: "5432"
          CORE_POSTGRES_DB: ${CORE_POSTGRES_DB:-rubrica_core}
          AUTH_API_URL: http://auth-api:8000
          CORE_INTERNAL_SERVICE_KEY: ${CORE_INTERNAL_SERVICE_KEY:-rubrica-local-core-key}
          NOTIFICATION_API_URL: http://notification-api:8000
          NOTIFICATION_INTERNAL_SERVICE_KEY: ${NOTIFICATION_INTERNAL_SERVICE_KEY:-rubrica-local-notification-key}
          CONTACT_INBOX_EMAIL: ${CONTACT_INBOX_EMAIL:-contact@rubricasignature.com}
          CONTACT_TURNSTILE_SITE_KEY: ${CONTACT_TURNSTILE_SITE_KEY:-}
          CONTACT_TURNSTILE_SECRET_KEY: ${CONTACT_TURNSTILE_SECRET_KEY:-}
          DOCUMENT_STORAGE_PATH: /var/lib/rubrica/documents
          DOCUMENT_MAX_SIZE_BYTES: ${DOCUMENT_MAX_SIZE_BYTES:-52428800}
          DOCUMENT_MAX_PAGES: ${DOCUMENT_MAX_PAGES:-1000}
          SIGNING_APP_URL: ${SIGNING_APP_URL:-http://localhost:7171/signing}
          PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:7171}
          EVIDENCE_SECRET: ${EVIDENCE_SECRET:-rubrica-development-evidence-secret-change-me}
          BILLING_PROVIDER: ${BILLING_PROVIDER:-fake}
          STRIPE_SECRET_KEY_FILE: /run/secrets/stripe_secret_key
          STRIPE_WEBHOOK_SECRET_FILE: /run/secrets/stripe_webhook_secret
          STRIPE_RUNTIME_WEBHOOK_SECRET_FILE: /run/rubrica/stripe/stripe_webhook_secret
          STRIPE_PRICE_BRL: ${STRIPE_PRICE_BRL:-}
          STRIPE_PRICE_USD: ${STRIPE_PRICE_USD:-}
          STRIPE_PRICE_EUR: ${STRIPE_PRICE_EUR:-}
          STRIPE_PRICE_JPY: ${STRIPE_PRICE_JPY:-}
          STRIPE_PRICE_INTERMEDIATE_BRL: ${STRIPE_PRICE_INTERMEDIATE_BRL:-}
          STRIPE_PRICE_INTERMEDIATE_USD: ${STRIPE_PRICE_INTERMEDIATE_USD:-}
          STRIPE_PRICE_INTERMEDIATE_EUR: ${STRIPE_PRICE_INTERMEDIATE_EUR:-}
          STRIPE_PRICE_INTERMEDIATE_JPY: ${STRIPE_PRICE_INTERMEDIATE_JPY:-}
          BILLING_GRACE_PERIOD_DAYS: ${BILLING_GRACE_PERIOD_DAYS:-10}

        volumes:
          - ../data/documents:/var/lib/rubrica/documents
          - stripe_webhook_runtime:/run/rubrica/stripe:ro
        secrets:
          - stripe_secret_key
          - stripe_webhook_secret
        depends_on:
          - postgres


      stripe-cli:
        profiles: ["stripe"]
        image: stripe/stripe-cli:latest
        entrypoint: ["/bin/sh", "-ec"]
        command:
          - |
            api_key="$$(tr -d '\r\n' < /run/secrets/stripe_secret_key)"
            /bin/stripe listen \
              --api-key "$$api_key" \
              --device-name rubrica-local-compose \
              --events checkout.session.completed,customer.subscription.created,customer.subscription.updated,customer.subscription.deleted,invoice.payment_succeeded,invoice.payment_failed \
              --forward-to http://core-api:8000/billing/webhooks/stripe 2>&1 | \
            while IFS= read -r line; do
              webhook_secret="$$(printf '%s\n' "$$line" | sed -n 's/.*\(whsec_[[:alnum:]]*\).*/\1/p')"
              if [ -n "$$webhook_secret" ]; then
                umask 077
                printf '%s' "$$webhook_secret" > /runtime/stripe_webhook_secret.tmp
                mv /runtime/stripe_webhook_secret.tmp /runtime/stripe_webhook_secret
                echo "Ready! Stripe webhook signing secret synchronized with Core."
              else
                printf '%s\n' "$$line"
              fi
            done
        secrets:
          - stripe_secret_key
        volumes:
          - stripe_webhook_runtime:/runtime
        depends_on:
          - core-api
        restart: unless-stopped


      web:
        build:
          context: ../../rubrica-web
          dockerfile: Dockerfile
        depends_on:
          - core-api
          - auth-api


      auth-api:
        build:
          context: ..
          dockerfile: apps/auth_api/dockerfile
        command: gunicorn auth_api.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers ${AUTH_WEB_CONCURRENCY:-2}
        environment:
          PYTHONPATH: apps/auth_api/src:packages/shared_kernel/src
          POSTGRES_USER: ${POSTGRES_USER:-rubrica}
          POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rubrica}
          POSTGRES_HOST: postgres
          POSTGRES_PORT: "5432"
          AUTH_POSTGRES_DB: ${AUTH_POSTGRES_DB:-rubrica_auth}
          AUTH_SEED_ADMIN_EMAIL: ${AUTH_SEED_ADMIN_EMAIL:-admin@example.local}
          AUTH_SEED_ADMIN_PASSWORD: ${AUTH_SEED_ADMIN_PASSWORD:-change-me-before-seeding}
          REDIS_HOST: redis
          REDIS_PORT: "6379"
          AUTH_PUBLIC_WEB_URL: ${AUTH_PUBLIC_WEB_URL:-http://localhost:7171}
          CORE_API_URL: http://core-api:8000
          CORE_INTERNAL_SERVICE_KEY: ${CORE_INTERNAL_SERVICE_KEY:-rubrica-local-core-key}
          AUTH_MFA_ISSUER: ${AUTH_MFA_ISSUER:-Rubrica}
          AUTH_MFA_ENCRYPTION_KEY: ${AUTH_MFA_ENCRYPTION_KEY:-rubrica-development-mfa-key-change-me}
          AUTH_IDENTITY_ENCRYPTION_KEY: ${AUTH_IDENTITY_ENCRYPTION_KEY:-rubrica-development-identity-key-change-me}
          AUTH_IDENTITY_HMAC_KEY: ${AUTH_IDENTITY_HMAC_KEY:-rubrica-development-identity-hmac-change-me}
          AUTH_JP_MY_NUMBER_ENABLED: ${AUTH_JP_MY_NUMBER_ENABLED:-false}
          AUTH_MFA_CHALLENGE_TTL_SECONDS: ${AUTH_MFA_CHALLENGE_TTL_SECONDS:-300}
          NOTIFICATION_API_URL: http://notification-api:8000
          NOTIFICATION_INTERNAL_SERVICE_KEY: ${NOTIFICATION_INTERNAL_SERVICE_KEY:-rubrica-local-notification-key}

        depends_on:
          - postgres
          - redis
          - notification-api
          - core-api

      eventing-api:
        build:
          context: ..
          dockerfile: apps/eventing_api/dockerfile
        environment:
          POSTGRES_USER: ${POSTGRES_USER:-rubrica}
          POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rubrica}
          POSTGRES_HOST: postgres
          POSTGRES_PORT: "5432"
          EVENTING_POSTGRES_DB: ${EVENTING_POSTGRES_DB:-rubrica_eventing}
          EVENTING_DEFAULT_EVENT_TOPIC: ${EVENTING_DEFAULT_EVENT_TOPIC:-rubrica.events}
          EVENTING_DEAD_LETTER_TOPIC: ${EVENTING_DEAD_LETTER_TOPIC:-rubrica.events.dead_letter}
        depends_on:
          postgres:
            condition: service_healthy

      notification-api:
        build:
          context: ..
          dockerfile: apps/notification_api/dockerfile
        environment:
          POSTGRES_USER: ${POSTGRES_USER:-rubrica}
          POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rubrica}
          POSTGRES_HOST: postgres
          POSTGRES_PORT: "5432"
          NOTIFICATION_POSTGRES_DB: ${NOTIFICATION_POSTGRES_DB:-rubrica_notification}
          NOTIFICATION_PERSISTENCE_MODE: ${NOTIFICATION_PERSISTENCE_MODE:-durable}
          NOTIFICATION_EMAIL_PROVIDER: ${NOTIFICATION_EMAIL_PROVIDER:-local_ack}
          NOTIFICATION_DEFAULT_FROM_EMAIL: ${NOTIFICATION_DEFAULT_FROM_EMAIL:-no-reply@rubrica.local}
          SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
          RESEND_API_KEY_FILE: /run/secrets/resend_api_key
          RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-Rubrica <onboarding@resend.dev>}
          NOTIFICATION_INTERNAL_SERVICE_KEY: ${NOTIFICATION_INTERNAL_SERVICE_KEY:-rubrica-local-notification-key}
          NOTIFICATION_INTERNAL_ALLOWED_SERVICES_RAW: auth_api,core_api,bootstrap
        secrets:
          - resend_api_key
        depends_on:
          postgres:
            condition: service_healthy

      gateway:
        image: nginx:stable-alpine
        profiles: ["gateway"]
        ports:
          - "${GATEWAY_HOST_PORT:-7171}:8080"
        volumes:
          - ../infra/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
          - ../infra/gateway/proxy_params:/etc/nginx/proxy_params:ro
        depends_on:
          - web
          - auth-api
          - core-api
        healthcheck:
          test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/gateway/health"]
          interval: 10s
          timeout: 3s
          retries: 5

      k6:
        image: grafana/k6:2.0.0
        profiles: ["benchmark"]
        working_dir: /scripts
        volumes:
          - ../performance/k6:/scripts:ro
          - ../.artifacts/benchmarks:/artifacts
        extra_hosts:
          - "host.docker.internal:host-gateway"

secrets:
  resend_api_key:
    file: ${SECRETS_DIR:-/etc/rubrica/secrets}/resend_api_key
  stripe_secret_key:
    file: ${SECRETS_DIR:-/etc/rubrica/secrets}/stripe_secret_key
  stripe_webhook_secret:
    file: ${SECRETS_DIR:-/etc/rubrica/secrets}/stripe_webhook_secret

volumes:
  stripe_webhook_runtime:
