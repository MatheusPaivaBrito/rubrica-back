name: rubrica-staging

include:
  - path: ./resources/production.yml
    project_directory: .
  - path: ./features/stripe-production.yml
    project_directory: .

services:
  postgres:
    extends: {file: ./services/postgres.yml, service: production}
  redis:
    extends: {file: ./services/redis.yml, service: production}
  auth-api:
    extends: {file: ./services/auth-api.yml, service: production}
  core-api:
    extends: {file: ./services/core-api.yml, service: production}
    environment:
      STRIPE_RUNTIME_WEBHOOK_SECRET_FILE: /run/rubrica/stripe/stripe_webhook_secret
    volumes:
      - document_storage:/var/lib/rubrica/documents
      - stripe_webhook_runtime:/run/rubrica/stripe:ro
  eventing-api:
    extends: {file: ./services/eventing-api.yml, service: production}
  observability-api:
    extends: {file: ./services/observability-api.yml, service: production}
  notification-api:
    extends: {file: ./services/notification-api.yml, service: production}
  web:
    extends: {file: ./services/web.yml, service: production}
  gateway:
    extends: {file: ./services/gateway.yml, service: production}
    ports:
      - "127.0.0.1:${STAGING_GATEWAY_HOST_PORT:-7271}:8080"
    networks:
      - rubrica_internal
      - rubrica_external

  stripe-cli:
    image: stripe/stripe-cli:latest
    profiles: ["staging-stripe"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        api_key="$$(tr -d '\r\n' < /run/secrets/stripe_secret_key)"
        /bin/stripe listen \
          --api-key "$$api_key" \
          --device-name rubrica-staging \
          --events checkout.session.completed,customer.subscription.created,customer.subscription.updated,customer.subscription.deleted,invoice.payment_succeeded,invoice.payment_failed \
          --forward-to http://core-api:8000/billing/webhooks/stripe 2>&1 | \
        while IFS= read -r line; do
          webhook_secret="$$(printf '%s\n' "$$line" | sed -n 's/.*\(whsec_[[:alnum:]]*\).*/\1/p')"
          if [ -n "$$webhook_secret" ]; then
            umask 077
            printf '%s' "$$webhook_secret" > /runtime/stripe_webhook_secret.tmp
            mv /runtime/stripe_webhook_secret.tmp /runtime/stripe_webhook_secret
            echo "Ready! Stripe test webhook secret synchronized with Core."
          else
            printf '%s\n' "$$line"
          fi
        done
    secrets:
      - stripe_secret_key
    volumes:
      - stripe_webhook_runtime:/runtime
    depends_on:
      core-api:
        condition: service_healthy
    networks:
      - rubrica_internal
      - rubrica_external

  quick-tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://gateway:8080"]
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - rubrica_internal
      - rubrica_external

volumes:
  postgres_data:
  redis_data:
  document_storage:
  stripe_webhook_runtime:

networks:
  rubrica_internal:
    internal: true
  rubrica_external:
  platform_observability:
    name: platform-observability
    external: true
