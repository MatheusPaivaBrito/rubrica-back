name: rubrica-prod

include:
  - path: ./resources/production.yml
    project_directory: .
  - path: ./features/stripe-production.yml
    project_directory: .

services:
  postgres:
    extends:
      file: ./services/postgres.yml
      service: production

  redis:
    extends:
      file: ./services/redis.yml
      service: production

  auth-api:
    extends:
      file: ./services/auth-api.yml
      service: production

  core-api:
    extends:
      file: ./services/core-api.yml
      service: production
    environment:
      CONTACT_TURNSTILE_SECRET_KEY_FILE: /run/secrets/contact_turnstile_secret_key
    secrets: [contact_turnstile_secret_key]
    networks:
      rubrica_internal:
      rubrica_external:
      platform_observability:
        aliases: [rubrica-core-api]

  enterprise-worker:
    extends: {file: ./services/enterprise-worker.yml, service: production}
    environment:
      CONTACT_TURNSTILE_SECRET_KEY_FILE: /run/secrets/contact_turnstile_secret_key
    secrets: [contact_turnstile_secret_key]
  enterprise-sandbox-worker:
    extends: {file: ./services/enterprise-worker.yml, service: production}
    environment:
      CONTACT_TURNSTILE_SECRET_KEY_FILE: /run/secrets/contact_turnstile_secret_key
    secrets: [contact_turnstile_secret_key]
    command: sh -c "mkdir -p /tmp/prometheus-multiproc && exec python -m core_api.modules.enterprise.worker --lane sandbox"
  enterprise-maintenance:
    extends: {file: ./services/enterprise-worker.yml, service: production}
    environment:
      CONTACT_TURNSTILE_SECRET_KEY_FILE: /run/secrets/contact_turnstile_secret_key
    secrets: [contact_turnstile_secret_key]
    command: sh -c "mkdir -p /tmp/prometheus-multiproc && exec python -m core_api.modules.enterprise.worker --lane maintenance"
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav_database:/var/lib/clamav
    networks: [rubrica_internal, rubrica_external]
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 128
    security_opt: [no-new-privileges:true]

  eventing-api:
    extends:
      file: ./services/eventing-api.yml
      service: production

  observability-api:
    extends:
      file: ./services/observability-api.yml
      service: production

  notification-api:
    extends:
      file: ./services/notification-api.yml
      service: production

  web:
    extends:
      file: ./services/web.yml
      service: production

  gateway:
    extends:
      file: ./services/gateway.yml
      service: production

  cloudflared:
    extends:
      file: ./services/cloudflared.yml
      service: production

volumes:
  clamav_database:

networks:
  platform_observability:
    name: platform-observability
    external: true
