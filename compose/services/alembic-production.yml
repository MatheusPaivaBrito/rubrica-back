# Applied after alembic.yml and production.yml; production secrets stay explicit.
services:
  alembic:
    environment:
      ENVIRONMENT: production
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      AUTH_MFA_ENCRYPTION_KEY_FILE: /run/secrets/auth_mfa_encryption_key
      AUTH_IDENTITY_ENCRYPTION_KEY_FILE: /run/secrets/auth_identity_encryption_key
      AUTH_IDENTITY_HMAC_KEY_FILE: /run/secrets/auth_identity_hmac_key
      TENANT_IDENTITY_ENCRYPTION_KEY_FILE: /run/secrets/tenant_identity_encryption_key
      TENANT_IDENTITY_HMAC_KEY_FILE: /run/secrets/tenant_identity_hmac_key
      EVIDENCE_SECRET_FILE: /run/secrets/evidence_secret
      DOCUMENT_STORAGE_PROVIDER: r2
      R2_DOCUMENTS_ENDPOINT_FILE: /run/secrets/r2_documents_endpoint
      R2_DOCUMENTS_ACCESS_KEY_ID_FILE: /run/secrets/r2_documents_access_key_id
      R2_DOCUMENTS_SECRET_ACCESS_KEY_FILE: /run/secrets/r2_documents_secret_access_key
      R2_DOCUMENTS_BUCKET_FILE: /run/secrets/r2_documents_bucket
      R2_DOCUMENTS_PREFIX: ${R2_DOCUMENTS_PREFIX-}
      DOCUMENT_STORAGE_ENCRYPTION_KEY_FILE: /run/secrets/document_storage_encryption_key
      DOCUMENT_STORAGE_ALLOW_LEGACY_PLAINTEXT: ${DOCUMENT_STORAGE_ALLOW_LEGACY_PLAINTEXT:-true}
      DOCUMENT_STORAGE_ENCRYPTION_CHUNK_BYTES: ${DOCUMENT_STORAGE_ENCRYPTION_CHUNK_BYTES:-4194304}
    secrets:
      - postgres_password
      - auth_mfa_encryption_key
      - auth_identity_encryption_key
      - auth_identity_hmac_key
      - tenant_identity_encryption_key
      - tenant_identity_hmac_key
      - evidence_secret
      - r2_documents_endpoint
      - r2_documents_access_key_id
      - r2_documents_secret_access_key
      - r2_documents_bucket
      - document_storage_encryption_key
    networks:
      - rubrica_internal
      - rubrica_external
