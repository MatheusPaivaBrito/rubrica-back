services:
  production:
    extends: {file: ./core-api.yml, service: production}
    command: sh -c "mkdir -p /tmp/prometheus-multiproc && exec python -m core_api.modules.enterprise.worker --lane live"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 1280m
    cpus: 1.0
    environment:
      ENTERPRISE_DEDICATED_WORKERS: "true"
      ENTERPRISE_JOB_MEMORY_MIB: ${ENTERPRISE_JOB_MEMORY_MIB:-1024}
    networks:
      rubrica_internal:
      rubrica_external:
