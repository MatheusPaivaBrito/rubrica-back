services:
  local:
    build:
      context: ../../../rubrica-web
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-7180}:80"
    depends_on:
      - core-api
      - auth-api

  production:
    build:
      context: ${RUBRICA_WEB_CONTEXT:-../../../rubrica-front}
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      RUBRICA_DOMAIN: ${RUBRICA_DOMAIN:-rubricasignature.com}
    depends_on:
      auth-api:
        condition: service_started
      core-api:
        condition: service_started
      eventing-api:
        condition: service_started
      notification-api:
        condition: service_started
    networks:
      - rubrica_internal
