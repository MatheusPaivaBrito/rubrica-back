# Local-only overlay. The script also rejects non-development environments.
services:
  seed:
    extends:
      file: ./services/alembic.yml
      service: alembic
    build:
      context: ..
      dockerfile: apps/core_api/dockerfile
    command: [python, toolbox/seeds/local_test_accounts.py]
    environment:
      ALLOW_LOCAL_TEST_SEED: "1"
      LOCAL_TEST_ACCOUNT_PASSWORD: ${LOCAL_TEST_ACCOUNT_PASSWORD:-RubricaLocal123!}
      TENANT_IDENTITY_ENCRYPTION_KEY: ${TENANT_IDENTITY_ENCRYPTION_KEY:-rubrica-development-tenant-encryption-key-change-me}
      TENANT_IDENTITY_HMAC_KEY: ${TENANT_IDENTITY_HMAC_KEY:-rubrica-development-tenant-hmac-key-change-me}
