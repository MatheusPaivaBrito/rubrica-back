# Explicit overlay: never included by the runtime entrypoints.
services:
  alembic:
    profiles: [maintenance]
    build:
      context: ..
      dockerfile: apps/core_api/dockerfile
    restart: "no"
    command: [python, toolbox/database/migrate.py, all]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PYTHONPATH: .:apps/auth_api/src:apps/core_api/src:apps/eventing_api/src:apps/notification_api/src:packages/shared_kernel/src
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-rubrica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rubrica}
      AUTH_POSTGRES_DB: ${AUTH_POSTGRES_DB:-rubrica_auth}
      CORE_POSTGRES_DB: ${CORE_POSTGRES_DB:-rubrica_core}
      EVENTING_POSTGRES_DB: ${EVENTING_POSTGRES_DB:-rubrica_eventing}
      NOTIFICATION_POSTGRES_DB: ${NOTIFICATION_POSTGRES_DB:-rubrica_notification}
    depends_on:
      postgres:
        condition: service_healthy
