services:
  local:
    build:
      context: ../..
      dockerfile: apps/notification_api/dockerfile
    ports:
      - "127.0.0.1:${NOTIFICATION_API_HOST_PORT:-7104}:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rubrica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rubrica}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      NOTIFICATION_POSTGRES_DB: ${NOTIFICATION_POSTGRES_DB:-rubrica_notification}
      NOTIFICATION_PERSISTENCE_MODE: ${NOTIFICATION_PERSISTENCE_MODE:-durable}
      NOTIFICATION_EMAIL_PROVIDER: ${NOTIFICATION_EMAIL_PROVIDER:-local_ack}
      NOTIFICATION_DEFAULT_FROM_EMAIL: ${NOTIFICATION_DEFAULT_FROM_EMAIL:-no-reply@rubrica.local}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      RESEND_API_KEY_FILE: /run/secrets/resend_api_key
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-Rubrica <onboarding@resend.dev>}
      NOTIFICATION_INTERNAL_SERVICE_KEY: ${NOTIFICATION_INTERNAL_SERVICE_KEY:-rubrica-local-notification-key}
      NOTIFICATION_INTERNAL_ALLOWED_SERVICES_RAW: auth_api,core_api,bootstrap
    secrets:
      - resend_api_key
    depends_on:
      postgres:
        condition: service_healthy

  production:
    build:
      context: ../..
      dockerfile: apps/notification_api/dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      POSTGRES_USER: ${POSTGRES_USER:-rubrica}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      NOTIFICATION_POSTGRES_DB: ${NOTIFICATION_POSTGRES_DB:-rubrica_notification}
      NOTIFICATION_PERSISTENCE_MODE: durable
      NOTIFICATION_EMAIL_PROVIDER: resend
      NOTIFICATION_DEFAULT_FROM_EMAIL: ${NOTIFICATION_DEFAULT_FROM_EMAIL:-no-reply@rubricasignature.com}
      RESEND_API_KEY_FILE: /run/secrets/resend_api_key
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-Rubrica <no-reply@rubricasignature.com>}
      NOTIFICATION_INTERNAL_SERVICE_KEY_FILE: /run/secrets/notification_internal_service_key
      NOTIFICATION_INTERNAL_ALLOWED_SERVICES_RAW: auth_api,core_api,bootstrap
    secrets:
      - postgres_password
      - resend_api_key
      - notification_internal_service_key
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rubrica_internal
      - rubrica_external
