services:
  local:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-7171}:8080"
    volumes:
      - ../../infra/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../infra/gateway/proxy_params:/etc/nginx/proxy_params:ro
    depends_on:
      - web
      - auth-api
      - core-api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/gateway/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  production:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-7171}:8080"
    volumes:
      - ../../infra/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../infra/gateway/proxy_params:/etc/nginx/proxy_params:ro
    depends_on:
      web:
        condition: service_started
      auth-api:
        condition: service_started
      core-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/gateway/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - rubrica_internal
