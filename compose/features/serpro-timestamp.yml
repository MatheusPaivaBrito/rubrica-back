services:
  core-api:
    environment:
      SERPRO_TIMESTAMP_PROVIDER: serpro
      SERPRO_TIMESTAMP_CONSUMER_KEY: ${SERPRO_TIMESTAMP_CONSUMER_KEY:-}
      SERPRO_TIMESTAMP_CONSUMER_SECRET_FILE: /run/secrets/serpro_timestamp_consumer_secret
      SERPRO_TIMESTAMP_TRUST_ROOTS_FILE: /run/secrets/serpro_timestamp_trust_roots
      SERPRO_TIMESTAMP_ACCEPTED_POLICY_OIDS: ${SERPRO_TIMESTAMP_ACCEPTED_POLICY_OIDS:-}
    secrets:
      - serpro_timestamp_consumer_secret
      - serpro_timestamp_trust_roots

secrets:
  serpro_timestamp_consumer_secret:
    file: ${SECRETS_DIR:-/etc/rubrica/secrets}/serpro_timestamp_consumer_secret
  serpro_timestamp_trust_roots:
    file: ${SECRETS_DIR:-/etc/rubrica/secrets}/serpro_timestamp_trust_roots.pem
