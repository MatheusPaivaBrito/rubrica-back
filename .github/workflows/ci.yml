name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - name: Install locked dependencies
        run: poetry install --no-interaction --no-root

      - name: Validate project metadata
        run: poetry check

      - name: Run static checks
        run: make lint

      - name: Run unit and route contract tests
        run: make test

      - name: Validate Compose configuration
        run: docker compose config -q

      - name: Prepare CI environment
        run: cp .env.local.example .env

      - name: Apply every migration on clean PostgreSQL databases
        run: make migrate-all

      - name: Stop CI containers
        if: always()
        run: docker compose down --volumes --remove-orphans
