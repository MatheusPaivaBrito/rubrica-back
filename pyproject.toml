[project]
name = "rubrica"
version = "0.1.0"
description = "Standalone FastAPI backend generated from AtlasCore."
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn (>=0.48.0,<0.49.0)",
    "gunicorn (>=23.0.0,<24.0.0)",
    "sqlalchemy (>=2.0.50,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "orjson (>=3.11.9,<4.0.0)",

    "bcrypt (>=4.3.0,<5.0.0)",
    "redis (>=8.0.0,<9.0.0)",
    "pypdf (>=6.0.0,<7.0.0)",
    "reportlab (>=4.4.0,<5.0.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.15.15,<0.16.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
